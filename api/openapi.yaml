openapi: 3.1.0
info:
  title: CyberDitto API
  version: 0.1.0
  description: >
    Control-plane API for CyberDitto. This is the source of truth for the
    server types and the generated TypeScript client (see docs/MASTER_PLAN.md
    §5.4). Grows one endpoint group at a time per the phase roadmap in
    docs/MASTER_PLAN.md §10. Codegen (oapi-codegen for Go, openapi-typescript
    for the web client) is not wired up yet (tracked in docs/PROGRESS.md);
    this file is hand-kept in sync with internal/transport/http for now.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check.
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/auth/setup-status:
    get:
      operationId: getSetupStatus
      summary: Whether the first-run owner account has been created yet.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [initialized]
                properties:
                  initialized:
                    type: boolean
  /api/v1/auth/setup:
    post:
      operationId: postAuthSetup
      summary: First-run setup. Creates the single owner account and its default workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Owner account created.
        "409":
          description: An owner account already exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: Invalid email/password (e.g. password too short).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      summary: Log in and receive a session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Logged in; session cookie set.
        "401":
          description: Invalid credentials (same response for unknown email or wrong password).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      summary: Revoke the current session.
      responses:
        "204":
          description: Logged out (idempotent).
  /api/v1/me:
    get:
      operationId: getMe
      summary: The authenticated user and their workspace membership.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: No valid session.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/twins:
    post:
      operationId: postTwins
      summary: Create a twin and start its build (requires twins:manage).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                snapshot_id:
                  type: string
                  format: uuid
                  description: >
                    Optional in Phase 1 (Assets/Snapshots upload doesn't
                    exist yet); a synthetic one is generated if omitted.
      responses:
        "201":
          description: Twin created; build started in the background.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Twin"
        "403":
          description: Role lacks twins:manage.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: getTwins
      summary: List twins in the caller's workspace (requires twins:view).
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [twins]
                properties:
                  twins:
                    type: array
                    items:
                      $ref: "#/components/schemas/Twin"
  /api/v1/twins/{id}:
    get:
      operationId: getTwin
      summary: Get one twin (requires twins:view).
      parameters:
        - $ref: "#/components/parameters/TwinId"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Twin"
        "404":
          description: Not found (or belongs to another workspace).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/twins/{id}/events:
    get:
      operationId: getTwinEvents
      summary: >
        Server-Sent Events stream of this twin's lifecycle events (build
        progress, start/stop/destroy), replaying everything recorded so far
        before switching to live events (requires twins:view).
      parameters:
        - $ref: "#/components/parameters/TwinId"
      responses:
        "200":
          description: text/event-stream of TwinEvent payloads.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/TwinEvent"
  /api/v1/twins/{id}/start:
    post:
      operationId: postTwinStart
      summary: Start a Ready or Stopped twin (requires twins:manage).
      parameters:
        - $ref: "#/components/parameters/TwinId"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Twin"
        "409":
          description: Twin is not in a state that can be started.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/twins/{id}/stop:
    post:
      operationId: postTwinStop
      summary: Stop a Running twin (requires twins:manage).
      parameters:
        - $ref: "#/components/parameters/TwinId"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Twin"
        "409":
          description: Twin is not in a state that can be stopped.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/twins/{id}/destroy:
    post:
      operationId: postTwinDestroy
      summary: Permanently destroy a twin (requires twins:manage).
      parameters:
        - $ref: "#/components/parameters/TwinId"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Twin"
        "409":
          description: Twin is already destroyed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  parameters:
    TwinId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: dev
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
    Me:
      type: object
      required: [user_id, email, workspace_id, role, approver]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        workspace_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, analyst, viewer]
        approver:
          type: boolean
    Twin:
      type: object
      required: [id, workspace_id, snapshot_id, provider, state, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        snapshot_id:
          type: string
          format: uuid
        provider:
          type: string
          example: fake
        state:
          type: string
          enum: [requested, imaging, provisioning, applying, verifying, ready, running, stopped, failed, destroyed]
        fidelity_score:
          type: number
          nullable: true
          description: Not populated until the Phase 2 real lab provider lands.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TwinEvent:
      type: object
      required: [sequence, state, message, created_at]
      properties:
        sequence:
          type: integer
          description: Per-twin, strictly increasing; use as the SSE event id.
        state:
          type: string
        message:
          type: string
        created_at:
          type: string
          format: date-time
    Problem:
      description: RFC 9457 problem+json error shape (docs/MASTER_PLAN.md §5.15).
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
