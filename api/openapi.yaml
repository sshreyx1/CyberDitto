openapi: 3.1.0
info:
  title: CyberDitto API
  version: 0.1.0
  description: >
    Control-plane API for CyberDitto. This is the source of truth for the
    server types and the generated TypeScript client (see docs/MASTER_PLAN.md
    §5.4). Grows one endpoint group at a time per the phase roadmap in
    docs/MASTER_PLAN.md §10. Codegen (oapi-codegen for Go, openapi-typescript
    for the web client) is not wired up yet (tracked in docs/PROGRESS.md);
    this file is hand-kept in sync with internal/transport/http for now.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check.
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/auth/setup-status:
    get:
      operationId: getSetupStatus
      summary: Whether the first-run owner account has been created yet.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [initialized]
                properties:
                  initialized:
                    type: boolean
  /api/v1/auth/setup:
    post:
      operationId: postAuthSetup
      summary: First-run setup. Creates the single owner account and its default workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Owner account created.
        "409":
          description: An owner account already exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: Invalid email/password (e.g. password too short).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      summary: Log in and receive a session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Logged in; session cookie set.
        "401":
          description: Invalid credentials (same response for unknown email or wrong password).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      summary: Revoke the current session.
      responses:
        "204":
          description: Logged out (idempotent).
  /api/v1/me:
    get:
      operationId: getMe
      summary: The authenticated user and their workspace membership.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: No valid session.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/assets:
    post:
      operationId: postAssets
      summary: Register an asset (requires assets:manage).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          description: Invalid name.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: getAssets
      summary: List assets in the caller's workspace (requires assets:view).
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [assets]
                properties:
                  assets:
                    type: array
                    items:
                      $ref: "#/components/schemas/Asset"
  /api/v1/assets/{id}:
    get:
      operationId: getAsset
      summary: Get one asset (requires assets:view).
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Not found (or belongs to another workspace).
  /api/v1/assets/{id}/snapshots:
    post:
      operationId: postAssetSnapshot
      summary: >
        Upload a collector snapshot as the asset's next immutable version
        (requires assets:manage). The body is the collector's output file
        exactly as written, max 5 MiB.
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: X-Snapshot-SHA256
          in: header
          required: false
          description: The digest the collector printed; if present, the body must match it.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectorDocument"
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotSummary"
        "400":
          description: Not a valid collector document.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Asset not found.
        "413":
          description: Larger than 5 MiB.
        "422":
          description: Body does not match X-Snapshot-SHA256.
    get:
      operationId: getAssetSnapshots
      summary: List an asset's snapshot versions, newest first, without bodies (requires assets:view).
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [snapshots]
                properties:
                  snapshots:
                    type: array
                    items:
                      $ref: "#/components/schemas/SnapshotSummary"
  /api/v1/snapshots/{id}:
    get:
      operationId: getSnapshot
      summary: Get one snapshot including its document (requires assets:view).
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SnapshotSummary"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/CollectorDocument"
        "404":
          description: Not found.
  /api/v1/twins:
    post:
      operationId: postTwins
      summary: Create a twin from a snapshot and start its build (requires twins:manage).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot_id]
              properties:
                snapshot_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Twin created; build started in the background.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Twin"
        "422":
          description: snapshot_id does not reference a snapshot in this workspace.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Role lacks twins:manage.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: getTwins
      summary: List twins in the caller's workspace (requires twins:view).
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [twins]
                properties:
                  twins:
                    type: array
                    items:
                      $ref: "#/components/schemas/Twin"
  /api/v1/twins/{id}:
    get:
      operationId: getTwin
      summary: Get one twin (requires twins:view).
      parameters:
        - $ref: "#/components/parameters/TwinId"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Twin"
        "404":
          description: Not found (or belongs to another workspace).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/twins/{id}/events:
    get:
      operationId: getTwinEvents
      summary: >
        Server-Sent Events stream of this twin's lifecycle events (build
        progress, start/stop/destroy), replaying everything recorded so far
        before switching to live events (requires twins:view).
      parameters:
        - $ref: "#/components/parameters/TwinId"
      responses:
        "200":
          description: text/event-stream of TwinEvent payloads.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/TwinEvent"
  /api/v1/twins/{id}/start:
    post:
      operationId: postTwinStart
      summary: Start a Ready or Stopped twin (requires twins:manage).
      parameters:
        - $ref: "#/components/parameters/TwinId"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Twin"
        "409":
          description: Twin is not in a state that can be started.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/twins/{id}/stop:
    post:
      operationId: postTwinStop
      summary: Stop a Running twin (requires twins:manage).
      parameters:
        - $ref: "#/components/parameters/TwinId"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Twin"
        "409":
          description: Twin is not in a state that can be stopped.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/twins/{id}/destroy:
    post:
      operationId: postTwinDestroy
      summary: Permanently destroy a twin (requires twins:manage).
      parameters:
        - $ref: "#/components/parameters/TwinId"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Twin"
        "409":
          description: Twin is already destroyed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TwinId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: dev
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
    Me:
      type: object
      required: [user_id, email, workspace_id, role, approver]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        workspace_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, analyst, viewer]
        approver:
          type: boolean
    Asset:
      type: object
      required: [id, workspace_id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SnapshotSummary:
      type: object
      required: [id, asset_id, version, sha256, created_at]
      properties:
        id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        sha256:
          type: string
          description: Hex SHA-256 of the exact bytes received.
        created_at:
          type: string
          format: date-time
    CollectorDocument:
      description: >
        services/collector output, schema version 1. Each field has exactly
        one of value (the category was read) or error (it could not be;
        the category is unknown, never defaulted).
      type: object
      additionalProperties: false
      required: [schema_version, hostname, collected_at, fields]
      properties:
        schema_version:
          type: string
          enum: ["1"]
        hostname:
          type: string
        collected_at:
          type: string
          format: date-time
        fields:
          type: object
          minProperties: 1
          additionalProperties:
            type: object
            additionalProperties: false
            required: [source, collected_at]
            properties:
              source:
                type: string
              collected_at:
                type: string
                format: date-time
              value: {}
              error:
                type: string
    Twin:
      type: object
      required: [id, workspace_id, snapshot_id, provider, state, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        snapshot_id:
          type: string
          format: uuid
        provider:
          type: string
          example: fake
        state:
          type: string
          enum: [requested, imaging, provisioning, applying, verifying, ready, running, stopped, failed, destroyed]
        fidelity_score:
          type: number
          nullable: true
          description: Not populated until the Phase 2 real lab provider lands.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TwinEvent:
      type: object
      required: [sequence, state, message, created_at]
      properties:
        sequence:
          type: integer
          description: Per-twin, strictly increasing; use as the SSE event id.
        state:
          type: string
        message:
          type: string
        created_at:
          type: string
          format: date-time
    Problem:
      description: RFC 9457 problem+json error shape (docs/MASTER_PLAN.md §5.15).
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
