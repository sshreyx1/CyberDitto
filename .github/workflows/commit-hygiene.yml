name: commit-hygiene

on:
  pull_request:

permissions:
  contents: read

jobs:
  no-ai-attribution:
    name: Reject AI-attribution trailers (docs/MASTER_PLAN.md §12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan commit messages in this PR
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad=0
          while IFS= read -r sha; do
            msg=$(git log -1 --format=%B "$sha")
            if echo "$msg" | grep -Eiq '^(co-authored-by:.*(claude|anthropic|noreply@anthropic\.com)|claude-session:)|generated with .?claude|🤖 generated'; then
              echo "::error::Commit $sha contains an AI-attribution trailer."
              bad=1
            fi
          done < <(git rev-list "$base..$head")
          exit $bad
