name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go build / vet / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: cyberditto
          POSTGRES_PASSWORD: ci_admin_password
          POSTGRES_DB: cyberditto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyberditto -d cyberditto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CD_DATABASE_URL: postgres://cyberditto:ci_admin_password@localhost:5432/cyberditto?sslmode=disable
      CD_APP_DB_PASSWORD: ci_app_password
      CD_TEST_DATABASE_URL: postgres://cyberditto_app:ci_app_password@localhost:5432/cyberditto?sslmode=disable
      CD_TEST_ADMIN_DATABASE_URL: postgres://cyberditto:ci_admin_password@localhost:5432/cyberditto?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Run migrations
        run: go run ./cmd/migrate up
      - name: Grant the app role LOGIN (docs/adr/0003, §6.2 non-superuser app role)
        run: go run ./cmd/migrate grant-app-login
      - name: Test
        run: go test ./... -race -count=1
      - name: Integration test (docs/adr/0012)
        run: go test -tags integration ./... -race -count=1

  web:
    name: Web build / typecheck
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.14.0"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @cyberditto/web typecheck
      - name: Build
        run: pnpm --filter @cyberditto/web build

  repo-hygiene:
    name: Repo hygiene guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Block forbidden paths/files (docs/MASTER_PLAN.md §10 Phase 0)
        run: |
          set -euo pipefail
          hits=$(git ls-files \
            | grep -E '(^|/)(security_posture\.json|.*\.vagrant.*|\.vagrant/.*|node_modules/.*)(/|$)' \
            || true)
          legacy_hits=$(git ls-files | grep -E '(^|/)legacy/' || true)
          envfile_hits=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.env\.example$' || true)
          if [ -n "$hits$legacy_hits$envfile_hits" ]; then
            echo "Forbidden tracked files found:"
            echo "$hits$legacy_hits$envfile_hits"
            exit 1
          fi
