name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go build / vet / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -count=1

  repo-hygiene:
    name: Repo hygiene guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Block forbidden paths/files (docs/MASTER_PLAN.md §10 Phase 0)
        run: |
          set -euo pipefail
          hits=$(git ls-files \
            | grep -E '(^|/)(security_posture\.json|.*\.vagrant.*|\.vagrant/.*|node_modules/.*)(/|$)' \
            || true)
          legacy_hits=$(git ls-files | grep -E '(^|/)legacy/' || true)
          envfile_hits=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.env\.example$' || true)
          if [ -n "$hits$legacy_hits$envfile_hits" ]; then
            echo "Forbidden tracked files found:"
            echo "$hits$legacy_hits$envfile_hits"
            exit 1
          fi
