version: "3"

vars:
  GO_API_DIR: services/api
  GO_COLLECTOR_DIR: services/collector

tasks:
  default:
    cmds:
      - task: lint
      - task: test

  dev:
    desc: Run the Go control-plane API and the web app together.
    deps: [dev:api, dev:web]

  dev:api:
    desc: Run the Go control-plane API locally.
    dir: "{{.GO_API_DIR}}"
    cmds:
      - go run ./cmd/api

  dev:web:
    desc: Run the Next.js web app locally.
    cmds:
      - pnpm --filter @cyberditto/web dev

  build:
    desc: Build the Go binaries and the web app.
    cmds:
      - task: build:api
      - task: build:collector
      - task: build:web

  build:api:
    desc: Build all Go binaries.
    dir: "{{.GO_API_DIR}}"
    cmds:
      - go build ./...

  build:collector:
    desc: Build the host collector binary.
    dir: "{{.GO_COLLECTOR_DIR}}"
    cmds:
      - go build ./...

  build:web:
    desc: Build the Next.js web app.
    cmds:
      - pnpm --filter @cyberditto/web build

  test:
    desc: Run Go unit tests with race detection (api + collector).
    cmds:
      - task: test:api
      - task: test:collector

  test:api:
    dir: "{{.GO_API_DIR}}"
    cmds:
      - go test ./... -race -count=1

  test:collector:
    dir: "{{.GO_COLLECTOR_DIR}}"
    cmds:
      - go test ./... -race -count=1

  vet:
    desc: Run go vet (api + collector).
    cmds:
      - task: vet:api
      - task: vet:collector

  vet:api:
    dir: "{{.GO_API_DIR}}"
    cmds:
      - go vet ./...

  vet:collector:
    dir: "{{.GO_COLLECTOR_DIR}}"
    cmds:
      - go vet ./...

  lint:
    desc: Run go vet and typecheck the web app (golangci-lint/eslint added once wired up in CI image).
    cmds:
      - task: vet
      - pnpm --filter @cyberditto/web typecheck

  gen:
    desc: Regenerate server/client code from api/openapi.yaml (wired up in a later phase).
    cmds:
      - echo "codegen not wired up yet (Phase 1)"

  demo:
    desc: Run the app against the fake/demo providers (wired up once the demo exists).
    cmds:
      - echo "demo mode not wired up yet (Phase 1)"

  e2e:
    desc: Run Playwright e2e tests (wired up in Phase 1).
    cmds:
      - echo "e2e not wired up yet (Phase 1)"

  release:
    desc: Build release artifacts (wired up in Phase 8).
    cmds:
      - echo "release not wired up yet (Phase 8)"
